[package]
name = "telemetry-client"
version = "0.15.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.4", features = ["rustls-tls-native-roots"], default-features = false }
serde = { version = "1.0.188", features = ["derive"], default-features = false }
serde_json = "1.0.107"
thiserror = "2.0.20"

[dev-dependencies]
httpmock = "0.8.3"
tokio = { version = "1.35.0", default-features = false, features = ["macros", "rt-multi-thread"] }
