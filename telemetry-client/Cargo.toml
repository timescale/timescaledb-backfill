[package]
name = "telemetry-client"
version = "0.1.2"
edition = "2021"

[dependencies]
reqwest = { version = "0.11.22", features = ["rustls-tls-native-roots"], default-features = false }
serde = { version = "1.0.188", features = ["derive"], default-features = false }
serde_json = "1.0.107"
thiserror = "1.0.50"

[dev-dependencies]
httpmock = "0.6.8"
tokio = { version = "1.35.0", default-features = false, features = ["macros", "rt-multi-thread"] }
